<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AXIOM Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="./EmpireX.jpg">
</head>
<body>

<main>

    <section class="calculator">

        <!-- Brand / Logo -->
        <div class="brand">
            <img src="./EmpireX.jpg" alt="AXIOM logo" class="logo" />
            <span class="brand-name">AXIOM</span>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
        </div>

        <!-- History strip: shows the previous operation faintly -->
        <div class="history" id="history">&nbsp;</div>

        <div class="display" id="display">0</div>

        <div class="buttons" id="buttons">

            <button class="action clear">AC</button>
            <button class="action delete">DEL</button>
            <button class="operator">÷</button>
            <button class="operator">×</button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">-</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">+</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="equal">=</button>
            <button class="number zero">0</button>
            <button class="number dot">.</button>

        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
